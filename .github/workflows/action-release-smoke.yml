name: Action release smoke

# Manual, read-only, synthetic/stored evidence only. Run after exact PyPI publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.1.2
          persist-credentials: false
      - name: Passing tagged Action
        id: pass
        uses: hibou04-ops/omegaprompt@v2.1.2
        with:
          artifact: examples/reference/reference_artifact.json
          format: json
      - name: Blocking tagged Action
        id: block
        continue-on-error: true
        uses: hibou04-ops/omegaprompt@v2.1.2
        with:
          artifact: missing-artifact.json
          format: json
      - name: Verify exact package and pass/block outputs
        env:
          PASS: ${{ steps.pass.outputs.passed }}
          BLOCK: ${{ steps.block.outputs.passed }}
          BLOCK_CODE: ${{ steps.block.outputs.exit-code }}
          BLOCK_OUTCOME: ${{ steps.block.outcome }}
        run: |
          python -c "import omegaprompt; assert omegaprompt.__version__=='2.1.2'"
          python -m pip check
          test "$BLOCK_OUTCOME" = failure
          test "$PASS" = true
          test "$BLOCK" = false
          test "$BLOCK_CODE" = 2
